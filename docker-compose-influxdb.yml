version: '3.8'

services:
  influxdb:
    image: influxdb:2.7-alpine
    container_name: lobsense-influxdb-dev
    restart: always
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=password123
      - DOCKER_INFLUXDB_INIT_ORG=lobsense
      - DOCKER_INFLUXDB_INIT_BUCKET=lobsense_telemetry
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=my-super-secret-auth-token-12345
    volumes:
      - influxdb_dev_data:/var/lib/influxdb2

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: lobsense-mosquitto-dev
    restart: always
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./docker/mosquitto/config:/mosquitto/config
      - ./docker/mosquitto/data:/mosquitto/data
      - ./docker/mosquitto/log:/mosquitto/log

volumes:
  influxdb_dev_data:
